name: Build
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Policy regression checks
        run: dotnet run --project Tests/PolicyChecks -c Release -- manual-performance
      - name: Localization checks
        run: dotnet run --project Tests/LocalizationChecks -c Release
      - name: Build public package
        shell: pwsh
        run: ./Build.ps1 -OutputDirectory ./artifacts/public -WithoutCalibration
      - name: Build installer
        shell: pwsh
        run: ./Build-Installer.ps1 -PackageDirectory ./artifacts/public
